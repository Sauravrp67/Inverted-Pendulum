[platformio]
src_dir = ..

[env]
framework = arduino
build_src_filter =
    -<*>
    +<firmware/main.cpp>
    +<firmware/parameters.c>
    +<firmware/${sysenv.FIRMWARE_CONTROLLER}.cpp>
    +<controllers/classical/PIDController.cpp>
    +<controllers/mpc/mpc.cpp>
build_flags =
    -I..
    -I"${sysenv.FIRMWARE_VALUES_DIR}"

[env:bluepill]
platform = platformio/ststm32@17.1.0
board = bluepill_f103c8
upload_protocol = stlink
platform_packages =
    platformio/framework-arduinoststm32@4.20600.231001
    platformio/framework-cmsis@2.50700.210515
    platformio/toolchain-gccarmnoneeabi@1.120301.0
    platformio/tool-openocd@3.1200.0
    platformio/tool-scons@4.40502.0

[env:mega]
platform = platformio/atmelavr@5.0.0
board = megaatmega2560
build_unflags = -std=gnu++11
build_flags =
    ${env.build_flags}
    -std=gnu++17
platform_packages =
    platformio/framework-arduino-avr@5.2.0
    platformio/toolchain-atmelavr@1.70300.191015
    platformio/tool-avrdude@1.70200.0
    platformio/tool-scons@4.40502.0
